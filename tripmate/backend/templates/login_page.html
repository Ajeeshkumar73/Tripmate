<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – TripMate AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@400,0..1&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { font-family: 'Inter', sans-serif; }
    body { background: #051426; }
    .glass { background: rgba(18,32,51,0.8); backdrop-filter: blur(24px); border: 1px solid rgba(255,255,255,0.06); }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400; }
    .mat-filled { font-variation-settings: 'FILL' 1, 'wght' 400; }
    input { color-scheme: dark; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center px-4 relative overflow-hidden">
  <!-- Background -->
  <div class="absolute inset-0"><div class="absolute top-1/3 left-1/4 w-96 h-96 bg-[#95d3ba]/5 rounded-full blur-3xl"></div><div class="absolute bottom-1/4 right-1/3 w-80 h-80 bg-[#bec6e0]/5 rounded-full blur-3xl"></div></div>

  <div class="w-full max-w-md relative z-10">
    <!-- Logo -->
    <div class="text-center mb-8">
      <a href="/" class="inline-flex items-center gap-3">
        <span class="material-symbols-outlined text-[#95d3ba] text-4xl mat-filled">travel_explore</span>
        <span class="text-2xl font-black text-white">TripMate AI</span>
      </a>
      <p class="text-[#89938d] text-sm mt-2">Welcome back, traveler! 👋</p>
    </div>

    <div class="glass rounded-3xl p-8">
      <h2 class="text-2xl font-bold text-white mb-6">Sign In</h2>

      {% if messages %}
        {% for message in messages %}
        <div class="mb-4 flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium {% if message.tags == 'error' %}bg-red-900/30 text-red-400 border border-red-500/20{% else %}bg-[#95d3ba]/10 text-[#95d3ba] border border-[#95d3ba]/20{% endif %}">
          <span class="material-symbols-outlined text-[16px]">{% if message.tags == 'error' %}error{% else %}check_circle{% endif %}</span> {{ message }}
        </div>
        {% endfor %}
      {% endif %}

      <form method="POST" class="space-y-5">
        {% csrf_token %}
        <div>
          <label class="block text-xs font-semibold text-[#89938d] uppercase tracking-wider mb-2">Email Address</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-[#89938d] text-[18px]">mail</span>
            <input type="email" name="email" required placeholder="your@email.com" class="w-full bg-[#0d1c2f] border border-[#404944] rounded-xl pl-10 pr-4 py-3.5 text-[#d5e3fd] placeholder:text-[#404944] text-sm focus:border-[#95d3ba] focus:ring-1 focus:ring-[#95d3ba] outline-none transition-all" />
          </div>
        </div>
        <div>
          <div class="flex justify-between mb-2">
            <label class="text-xs font-semibold text-[#89938d] uppercase tracking-wider">Password</label>
          </div>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-[#89938d] text-[18px]">lock</span>
            <input type="password" id="password" name="password" required placeholder="Your password" class="w-full bg-[#0d1c2f] border border-[#404944] rounded-xl pl-10 pr-11 py-3.5 text-[#d5e3fd] placeholder:text-[#404944] text-sm focus:border-[#95d3ba] focus:ring-1 focus:ring-[#95d3ba] outline-none transition-all" />
            <button type="button" onclick="document.getElementById('password').type === 'password' ? document.getElementById('password').type = 'text' : document.getElementById('password').type = 'password'" class="absolute right-3 top-1/2 -translate-y-1/2 text-[#89938d] hover:text-[#d5e3fd]"><span class="material-symbols-outlined text-[18px]">visibility</span></button>
          </div>
        </div>
        <button type="submit" class="w-full py-4 bg-[#95d3ba] text-[#003829] rounded-xl font-bold text-base hover:shadow-2xl hover:shadow-[#95d3ba]/20 hover:-translate-y-0.5 active:scale-95 transition-all">Sign In →</button>
      </form>
      <p class="text-center text-sm text-[#89938d] mt-6">Don't have an account? <a href="{% url 'register_page' %}" class="text-[#95d3ba] font-semibold hover:underline">Create one free</a></p>
    </div>
  </div>
</body>
</html>
