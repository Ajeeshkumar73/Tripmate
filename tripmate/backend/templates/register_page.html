<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register – TripMate</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@400,0..1&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { font-family: 'Inter', sans-serif; }
    body { background: #051426; }
    .auth-card {
      background: rgba(28, 43, 62, 0.92);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      transition: all 0.25s ease;
    }
    .auth-card:hover {
      border-color: rgba(149, 211, 186, 0.35);
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.55), 0 0 20px rgba(149, 211, 186, 0.12);
    }
    input {
      color-scheme: dark;
      border: 1px solid rgba(255, 255, 255, 0.18) !important;
      background-color: #0d1c2f !important;
      transition: all 0.2s ease !important;
    }
    input:hover {
      border-color: rgba(149, 211, 186, 0.45) !important;
    }
    input:focus {
      border-color: #95d3ba !important;
      box-shadow: 0 0 0 3px rgba(149, 211, 186, 0.25) !important;
      outline: none !important;
    }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center px-4 py-8">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <a href="/" class="inline-flex items-center gap-3">
        <span class="material-symbols-outlined text-[#95d3ba] text-4xl" style="font-variation-settings:'FILL' 1,'wght' 400">travel_explore</span>
        <span class="text-2xl font-black text-white">TripMate</span>
      </a>
      <p class="text-[#89938d] text-sm mt-2">Create your account</p>
    </div>
    <div class="auth-card rounded-xl p-8">
      <h2 class="text-2xl font-bold text-white mb-6">Create Account</h2>
      {% if messages %}
        {% for message in messages %}
        <div class="django-message-item mb-4 flex items-center justify-between px-4 py-3 rounded-lg text-sm font-medium transition-all duration-500 {% if message.tags == 'error' %}bg-red-900/30 text-red-400 border border-red-500/20{% else %}bg-[#95d3ba]/10 text-[#95d3ba] border border-[#95d3ba]/20{% endif %}">
          <div class="flex items-center gap-3">
            <span class="material-symbols-outlined text-[16px]">{% if message.tags == 'error' %}error{% else %}check_circle{% endif %}</span>
            <span>{{ message }}</span>
          </div>
          <button onclick="this.closest('.django-message-item').remove()" class="text-xs opacity-70 hover:opacity-100 ml-3">
            <span class="material-symbols-outlined text-[16px]">close</span>
          </button>
        </div>
        {% endfor %}
      {% endif %}
      <form method="POST" class="space-y-4">
        {% csrf_token %}
        <div>
          <label class="block text-xs font-semibold text-[#89938d] uppercase tracking-wider mb-2">Username *</label>
          <div class="relative"><span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-[#89938d] text-[18px]">person</span><input type="text" name="username" required placeholder="coolTraveler123" class="w-full bg-[#0d1c2f] border border-[#404944] rounded-lg pl-10 pr-4 py-3.5 text-[#d5e3fd] placeholder:text-[#404944] text-sm focus:border-[#95d3ba] outline-none transition-all" /></div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-[#89938d] uppercase tracking-wider mb-2">Email Address *</label>
          <div class="relative"><span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-[#89938d] text-[18px]">mail</span><input type="email" name="email" required placeholder="your@email.com" class="w-full bg-[#0d1c2f] border border-[#404944] rounded-lg pl-10 pr-4 py-3.5 text-[#d5e3fd] placeholder:text-[#404944] text-sm focus:border-[#95d3ba] outline-none transition-all" /></div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-[#89938d] uppercase tracking-wider mb-2">First Name</label>
            <input type="text" name="first_name" placeholder="John" class="w-full bg-[#0d1c2f] border border-[#404944] rounded-lg px-4 py-3.5 text-[#d5e3fd] placeholder:text-[#404944] text-sm focus:border-[#95d3ba] outline-none transition-all" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-[#89938d] uppercase tracking-wider mb-2">Last Name</label>
            <input type="text" name="last_name" placeholder="Doe" class="w-full bg-[#0d1c2f] border border-[#404944] rounded-lg px-4 py-3.5 text-[#d5e3fd] placeholder:text-[#404944] text-sm focus:border-[#95d3ba] outline-none transition-all" />
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-[#89938d] uppercase tracking-wider mb-2">Password *</label>
          <div class="relative"><span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-[#89938d] text-[18px]">lock</span><input type="password" name="password" id="pwd" required placeholder="Min 6 characters" class="w-full bg-[#0d1c2f] border border-[#404944] rounded-lg pl-10 pr-11 py-3.5 text-[#d5e3fd] placeholder:text-[#404944] text-sm focus:border-[#95d3ba] outline-none transition-all" oninput="checkPwd()" /><button type="button" onclick="document.getElementById('pwd').type==='password'?document.getElementById('pwd').type='text':document.getElementById('pwd').type='password'" class="absolute right-3 top-1/2 -translate-y-1/2 text-[#89938d] hover:text-[#d5e3fd]"><span class="material-symbols-outlined text-[18px]">visibility</span></button></div>
          <div class="h-1 rounded-full bg-[#122033] mt-2 overflow-hidden"><div id="pwd-strength" class="h-full rounded-full transition-all duration-500" style="width:0%"></div></div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-[#89938d] uppercase tracking-wider mb-2">Confirm Password *</label>
          <div class="relative"><span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-[#89938d] text-[18px]">lock_reset</span><input type="password" name="confirm_password" required placeholder="Repeat password" class="w-full bg-[#0d1c2f] border border-[#404944] rounded-lg pl-10 pr-4 py-3.5 text-[#d5e3fd] placeholder:text-[#404944] text-sm focus:border-[#95d3ba] outline-none transition-all" /></div>
        </div>
        <button type="submit" class="w-full py-3.5 bg-[#95d3ba] text-[#003829] rounded-lg font-bold text-base hover:brightness-110 active:scale-95 transition-all mt-2">Create Account →</button>
      </form>
      <p class="text-center text-sm text-[#89938d] mt-5">Already have an account? <a href="{% url 'Login_page' %}" class="text-[#95d3ba] font-semibold hover:underline">Sign in</a></p>
    </div>
  </div>
  <script>
    function checkPwd() {
      const pwd = document.getElementById('pwd').value;
      const bar = document.getElementById('pwd-strength');
      let strength = 0;
      if (pwd.length >= 6) strength += 25;
      if (pwd.length >= 10) strength += 25;
      if (/[A-Z]/.test(pwd)) strength += 25;
      if (/[0-9!@#$%]/.test(pwd)) strength += 25;
      bar.style.width = strength + '%';
      bar.style.background = strength < 50 ? '#ef4444' : strength < 75 ? '#eab308' : '#95d3ba';
    }
    setTimeout(() => {
      document.querySelectorAll('.django-message-item').forEach(el => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(-10px)';
        setTimeout(() => el.remove(), 500);
      });
    }, 4000);
  </script>
</body>
</html>
