<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password – TripMate</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@400,0..1&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { font-family: 'Inter', sans-serif; }
    body { background: #051426; }
    .auth-card {
      background: rgba(28, 43, 62, 0.92);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      transition: all 0.25s ease;
    }
    .auth-card:hover {
      border-color: rgba(149, 211, 186, 0.35);
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.55), 0 0 20px rgba(149, 211, 186, 0.12);
    }
    input {
      color-scheme: dark;
      border: 1px solid rgba(255, 255, 255, 0.18) !important;
      background-color: #0d1c2f !important;
      transition: all 0.2s ease !important;
    }
    input:hover {
      border-color: rgba(149, 211, 186, 0.45) !important;
    }
    input:focus {
      border-color: #95d3ba !important;
      box-shadow: 0 0 0 3px rgba(149, 211, 186, 0.25) !important;
      outline: none !important;
    }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400; }
    .mat-filled { font-variation-settings: 'FILL' 1, 'wght' 400; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-md">
    <!-- Logo -->
    <div class="text-center mb-8">
      <a href="/" class="inline-flex items-center gap-3">
        <span class="material-symbols-outlined text-[#95d3ba] text-4xl mat-filled">travel_explore</span>
        <span class="text-2xl font-black text-white">TripMate</span>
      </a>
      <p class="text-[#89938d] text-sm mt-2">Create a new password</p>
    </div>

    <div class="auth-card rounded-xl p-8">
      <h2 class="text-2xl font-bold text-white mb-6">Reset Password</h2>

      {% if messages %}
        {% for message in messages %}
        <div class="django-message-item mb-4 flex items-center justify-between px-4 py-3 rounded-lg text-sm font-medium transition-all duration-500 {% if message.tags == 'error' %}bg-red-900/30 text-red-400 border border-red-500/20{% else %}bg-[#95d3ba]/10 text-[#95d3ba] border border-[#95d3ba]/20{% endif %}">
          <div class="flex items-center gap-3">
            <span class="material-symbols-outlined text-[16px]">{% if message.tags == 'error' %}error{% else %}check_circle{% endif %}</span>
            <span>{{ message }}</span>
          </div>
          <button onclick="this.closest('.django-message-item').remove()" class="text-xs opacity-70 hover:opacity-100 ml-3">
            <span class="material-symbols-outlined text-[16px]">close</span>
          </button>
        </div>
        {% endfor %}
      {% endif %}

      <form method="POST" action="{% url 'reset_password' %}" class="space-y-5">
        {% csrf_token %}
        <div>
          <label class="block text-xs font-semibold text-[#89938d] uppercase tracking-wider mb-2">New Password</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-[#89938d] text-[18px]">lock</span>
            <input type="password" id="password" name="password" required placeholder="New password" class="w-full bg-[#0d1c2f] border border-[#404944] rounded-lg pl-10 pr-11 py-3.5 text-[#d5e3fd] placeholder:text-[#404944] text-sm focus:border-[#95d3ba] focus:ring-1 focus:ring-[#95d3ba] outline-none transition-all" />
            <button type="button" onclick="document.getElementById('password').type === 'password' ? document.getElementById('password').type = 'text' : document.getElementById('password').type = 'password'" class="absolute right-3 top-1/2 -translate-y-1/2 text-[#89938d] hover:text-[#d5e3fd]"><span class="material-symbols-outlined text-[18px]">visibility</span></button>
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-[#89938d] uppercase tracking-wider mb-2">Confirm New Password</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-[#89938d] text-[18px]">lock</span>
            <input type="password" id="confirm_password" name="confirm_password" required placeholder="Confirm new password" class="w-full bg-[#0d1c2f] border border-[#404944] rounded-lg pl-10 pr-11 py-3.5 text-[#d5e3fd] placeholder:text-[#404944] text-sm focus:border-[#95d3ba] focus:ring-1 focus:ring-[#95d3ba] outline-none transition-all" />
            <button type="button" onclick="document.getElementById('confirm_password').type === 'password' ? document.getElementById('confirm_password').type = 'text' : document.getElementById('confirm_password').type = 'password'" class="absolute right-3 top-1/2 -translate-y-1/2 text-[#89938d] hover:text-[#d5e3fd]"><span class="material-symbols-outlined text-[18px]">visibility</span></button>
          </div>
        </div>
        <button type="submit" class="w-full py-3.5 bg-[#95d3ba] text-[#003829] rounded-lg font-bold text-base hover:brightness-110 active:scale-95 transition-all">Reset Password →</button>
      </form>
    </div>
  </div>
  <script>
    setTimeout(() => {
      document.querySelectorAll('.django-message-item').forEach(el => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(-10px)';
        setTimeout(() => el.remove(), 500);
      });
    }, 4000);
  </script>
</body>
</html>
